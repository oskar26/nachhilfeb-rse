name: Deploy to ALL-INKL

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "all-inkl-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to ALL-INKL
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Tests (Vitest-Regressionstests)
        run: npm test

      - name: 🔨 Build Production (Frontend + PHP API)
        run: npm run build

      - name: 🧭 Normalize FTP server path
        id: ftp-path
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          base="${FTP_SERVER_DIR:-/}"
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          echo "docs=${base}docs/" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy app via FTPS to ALL-INKL
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          security: loose
          timeout: 120000
          exclude: |
            docs/**
            uploads/ads/*.jpg
            uploads/ads/*.jpeg
            uploads/ads/*.png
            uploads/ads/*.webp
            uploads/ads/*.gif
            uploads/ads/*.JPG
            uploads/ads/*.JPEG
            uploads/ads/*.PNG
            uploads/ads/*.WEBP
            uploads/ads/*.GIF

      - name: 🗂️ Split docs assets for uploads
        run: |
          mkdir -p dist/docs-assets-css/assets dist/docs-assets-css/fonts
          mkdir -p dist/docs-assets-js-a/assets dist/docs-assets-js-b/assets
          mkdir -p dist/docs-rest
          find dist/docs/assets -maxdepth 1 -type f \( -name '*.css' -o -name '*.woff2' \) -exec cp {} dist/docs-assets-css/assets/ \;
          cp -R dist/docs/fonts/. dist/docs-assets-css/fonts/
          find dist/docs/assets -maxdepth 1 -type f -name '*.js' | sort | awk 'NR%2==1' | xargs -r -I{} cp {} dist/docs-assets-js-a/assets/
          find dist/docs/assets -maxdepth 1 -type f -name '*.js' | sort | awk 'NR%2==0' | xargs -r -I{} cp {} dist/docs-assets-js-b/assets/
          rsync -a --exclude assets --exclude fonts dist/docs/ dist/docs-rest/

      - name: 🎨 Deploy docs CSS and fonts via FTPS (optional)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/docs-assets-css/
          server-dir: ${{ steps.ftp-path.outputs.docs }}
          dangerous-clean-slate: false
          security: loose
          timeout: 300000
          state-name: .ftp-deploy-sync-state-docs-css.json

      - name: 🧩 Deploy docs JavaScript A via FTPS (optional)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/docs-assets-js-a/
          server-dir: ${{ steps.ftp-path.outputs.docs }}
          dangerous-clean-slate: false
          security: loose
          timeout: 300000
          state-name: .ftp-deploy-sync-state-docs-js-a.json

      - name: 🧩 Deploy docs JavaScript B via FTPS (optional)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/docs-assets-js-b/
          server-dir: ${{ steps.ftp-path.outputs.docs }}
          dangerous-clean-slate: false
          security: loose
          timeout: 300000
          state-name: .ftp-deploy-sync-state-docs-js-b.json

      - name: 📚 Deploy docs pages via FTPS (optional)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/docs-rest/
          server-dir: ${{ steps.ftp-path.outputs.docs }}
          dangerous-clean-slate: false
          security: loose
          timeout: 300000
          state-name: .ftp-deploy-sync-state-docs-rest.json
