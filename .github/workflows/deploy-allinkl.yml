name: Deploy to ALL-INKL

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "all-inkl-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to ALL-INKL
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Tests (Vitest-Regressionstests)
        run: npm test

      - name: 🔨 Build Production (Frontend + PHP API)
        run: npm run build

      - name: 🧭 Normalize FTP server path
        id: ftp-path
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          base="${FTP_SERVER_DIR:-/}"
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          echo "docs=${base}docs/" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy app via FTPS to ALL-INKL
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          security: loose
          timeout: 120000
          exclude: |
            docs/**
            uploads/ads/*.jpg
            uploads/ads/*.jpeg
            uploads/ads/*.png
            uploads/ads/*.webp
            uploads/ads/*.gif
            uploads/ads/*.JPG
            uploads/ads/*.JPEG
            uploads/ads/*.PNG
            uploads/ads/*.WEBP
            uploads/ads/*.GIF

      - name: 🧰 Install lftp for docs
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 📚 Deploy docs via FTPS (optional)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DOCS_DIR: ${{ steps.ftp-path.outputs.docs }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set ftp:prefer-epsv yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"ftps://$FTP_SERVER:21\";
            mirror -R --delete --verbose --parallel=1 ./dist/docs/ \"$FTP_DOCS_DIR\";
            bye
          "
