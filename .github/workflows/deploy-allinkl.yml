name: Deploy to ALL-INKL

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "all-inkl-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to ALL-INKL
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Tests (Vitest-Regressionstests)
        run: npm test

      - name: 🔨 Build Production (Frontend + PHP API)
        run: npm run build

      - name: 🧭 Normalize FTP server path
        id: ftp-path
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          base="${FTP_SERVER_DIR:-/}"
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          echo "docs=${base}docs/" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy app via FTPS to ALL-INKL
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          security: loose
          timeout: 120000
          exclude: |
            docs/**
            uploads/ads/*.jpg
            uploads/ads/*.jpeg
            uploads/ads/*.png
            uploads/ads/*.webp
            uploads/ads/*.gif
            uploads/ads/*.JPG
            uploads/ads/*.JPEG
            uploads/ads/*.PNG
            uploads/ads/*.WEBP
            uploads/ads/*.GIF

      - name: 🗂️ Stage docs pages
        run: |
          mkdir -p dist/docs-rest
          rsync -a --exclude assets --exclude fonts dist/docs/ dist/docs-rest/

      - name: 📦 Upload docs assets via curl FTPS (optional)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DOCS_DIR: ${{ steps.ftp-path.outputs.docs }}
        run: |
          set -uo pipefail
          failed=0
          upload() {
            local file="$1"
            local rel="${file#dist/docs/}"
            if ! curl --ftp-ssl-control --ftp-pasv --insecure --silent --show-error \
              --retry 3 --retry-delay 2 --connect-timeout 20 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" "ftp://$FTP_SERVER${FTP_DOCS_DIR}${rel}"; then
              echo "::warning::Upload fehlgeschlagen: $rel"
              failed=$((failed + 1))
            fi
            sleep 1
          }
          for file in dist/docs/assets/*; do upload "$file"; done
          for file in dist/docs/fonts/*; do upload "$file"; done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed Docs-Assets konnten nicht hochgeladen werden."
            exit 1
          fi

      - name: 📚 Deploy docs pages via FTPS (optional)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/docs-rest/
          server-dir: ${{ steps.ftp-path.outputs.docs }}
          dangerous-clean-slate: false
          security: loose
          timeout: 300000
          state-name: .ftp-deploy-sync-state-docs-rest.json
