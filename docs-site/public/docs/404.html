<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden – Nachhilfebörse Dokumentation</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f6f8;
        --card: #ffffff;
        --ink: #17181c;
        --muted: #5b616e;
        --border: #e3e6ec;
        --brand: #facc15;
        --brand-hover: #f5c000;
        --brand-ink: #171717;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #101216;
          --card: #171a20;
          --ink: #eceef2;
          --muted: #a2a8b4;
          --border: #2a2f38;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', sans-serif;
        letter-spacing: -0.011em;
      }

      main {
        width: 100%;
        max-width: 560px;
        padding: 40px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 18px 40px -24px rgb(23 24 28 / 0.18);
      }

      .kicker {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 28px;
        max-width: 45ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 9999px;
        background: var(--brand);
        color: var(--brand-ink);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: var(--brand-hover);
      }

      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>Seite nicht gefunden</h1>
      <p>
        Diese Dokumentationsseite gibt es nicht. Vielleicht wurde sie umbenannt
        oder der Link ist veraltet.
      </p>
      <a href="/docs/">Zur Dokumentation</a>
    </main>
  </body>
</html>
